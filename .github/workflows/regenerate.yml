name: Regenerate PluginMaster

# Triggered by the plugin repos' release workflows (they bump the manifest version in this repo,
# and that push lands here) and by any other push — that is what makes version updates instant.
#
# The schedule exists for DownloadCount only: GitHub has no "release asset downloaded" event, so
# the counts in pluginmaster.json can only be refreshed by polling. Versions never wait for it.
# Manual runs: Actions -> Regenerate PluginMaster -> Run workflow.

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '11 4 * * *'

concurrency: regenerate

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Generate and push PluginMaster
        run: |
          pip install --quiet -r requirements.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Two plugins can release seconds apart, so a push may land while this run is mid-flight and
          # make its own push non-fast-forward. Take the newest HEAD, regenerate, and retry.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --hard --quiet origin/main

            python generate_pluginmaster.py

            if git diff --quiet -- pluginmaster.json; then
              echo "pluginmaster.json unchanged — nothing to commit."
              exit 0
            fi

            git add pluginmaster.json
            git commit --quiet -m "Regenerate PluginMaster"

            if git push --quiet; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt — regenerating on top of the new HEAD."
            sleep 5
          done

          echo "::error::Could not push pluginmaster.json after 5 attempts."
          exit 1
