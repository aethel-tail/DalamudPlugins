name: Regenerate PluginMaster

# Triggered by the plugin repos' release workflows (they bump the manifest version in this repo,
# and that push lands here) and by any other push — that is what makes version updates instant.
#
# The schedule exists for DownloadCount only: GitHub has no "release asset downloaded" event, so
# the counts in pluginmaster.json can only be refreshed by polling. Versions never wait for it.
# Manual runs: Actions -> Regenerate PluginMaster -> Run workflow.

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '11 4 * * *'

concurrency: regenerate

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Generate PluginMaster
        run: |
          pip install -r requirements.txt
          python generate_pluginmaster.py

      - name: Commit PluginMaster
        run: |
          if git diff --quiet -- pluginmaster.json; then
            echo "pluginmaster.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "Regenerate PluginMaster"
          git push
